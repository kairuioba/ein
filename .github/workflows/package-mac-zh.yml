# 中文版 macOS 安装包（Apple 芯片 arm64 + Intel x64）。
#
# The Chinese edition's Mac build. A Mac .dmg can only be built on macOS
# (Swift helpers, codesign, hdiutil), so this runs on GitHub's macOS runner:
#
#   1. verify   — typecheck, unit tests and the localization coverage check
#   2. mac      — package both architectures and smoke-test the packaged server
#   3. publish  — (optional) attach the DMGs to a prerelease, only when both
#                 jobs above passed
#
# verify and mac run side by side: the installers are always produced (the
# packaging step type-checks and builds everything itself), while a release
# still requires the full test suite to be green.
#
# Signing: with the MAC_CERT_P12_BASE64 / MAC_CERT_PASSWORD secrets present
# the app is signed with that Developer ID (and notarized when the three
# APPLE_API_* secrets are present too). Without them it is ad-hoc signed:
# it runs, but macOS asks the user to approve it once in
# System Settings → Privacy & Security → “Open Anyway”.
#
# The DMGs land as a workflow artifact; tick “release” to also attach them to
# a GitHub prerelease named after the version.
name: Package macOS (zh-CN)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build (defaults to the branch this is run from)"
        required: false
        type: string
      release:
        description: "Also publish the DMGs to a GitHub prerelease"
        required: false
        type: boolean
        default: false
  push:
    tags: ["zh-v*"]

permissions:
  contents: write

jobs:
  verify:
    name: typecheck + tests + i18n
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Electron test runtime
        run: node --input-type=commonjs -e "require('electron')"
      - run: pnpm typecheck
      - name: Localization coverage (every t() source has a zh-CN entry)
        run: pnpm i18n:check
      - name: Unit tests
        run: pnpm exec vitest run
      - name: Production UI build
        run: pnpm exec vite build

  mac:
    name: macOS arm64 + x64
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release

      - name: Choose the signing mode
        id: signing
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            [ -n "$APPLE_API_KEY_P8_BASE64" ] && echo "notarize=true" >> "$GITHUB_OUTPUT" || echo "notarize=false" >> "$GITHUB_OUTPUT"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Developer ID secrets: building an ad-hoc signed app (users approve it once in Privacy & Security)."
          fi

      - name: Import the Developer ID certificate into a throwaway keychain
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Package both architectures (Developer ID)
        if: steps.signing.outputs.mode == 'developer-id'
        run: pnpm package:mac

      - name: Package both architectures (ad-hoc signature)
        if: steps.signing.outputs.mode == 'adhoc'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm package:mac -c.mac.identity=- -c.dmg.sign=false

      - name: "Gate: signatures verify and both packaged servers start"
        run: |
          for app in release/mac-arm64/Ein.app release/mac/Ein.app; do
            codesign --verify --deep --strict "$app"
            res="$app/Contents/Resources"
            OMB_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs \
              || { echo "::error::packaged server in $app failed to start"; exit 1; }
            test -f "$app/Contents/Resources/app.asar" || { echo "::error::missing app.asar in $app"; exit 1; }
            npx --yes @electron/asar list "$res/app.asar" | grep -q "shared/i18n/zh-CN.json" \
              || { echo "::error::the zh-CN dictionary is missing from $app"; exit 1; }
            # Finder / Dock / menu bar say 一念 or Ein; the bundle keeps its name
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Contents/Info.plist")" = "Ein" \
              || { echo "::error::CFBundleDisplayName is not Ein in $app"; exit 1; }
            for lproj in en zh_CN; do
              test -f "$res/$lproj.lproj/InfoPlist.strings" \
                || { echo "::error::$lproj.lproj/InfoPlist.strings is missing from $app"; exit 1; }
            done
            echo "ok: $app"
          done

      - name: Notarize and staple
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          for f in release/*.dmg; do
            out=$(xcrun notarytool submit "$f" --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait 2>&1)
            echo "$out" | tail -2
            echo "$out" | grep -q "status: Accepted" || { echo "::error::notarization not Accepted for $f"; exit 1; }
            xcrun stapler staple "$f"
          done
          rm "$RUNNER_TEMP/notary.p8"

      - name: Name the installers
        id: names
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir -p dist-zh
          cp "release/Ein-$v-arm64.dmg" "dist-zh/Ein-zh-$v-apple-silicon.dmg"
          cp "release/Ein-$v-x64.dmg" "dist-zh/Ein-zh-$v-intel.dmg"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          ls -lh dist-zh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ein-zh-mac-${{ steps.names.outputs.version }}
          path: dist-zh/*.dmg
          if-no-files-found: error
          retention-days: 14

    outputs:
      version: ${{ steps.names.outputs.version }}
      signing: ${{ steps.signing.outputs.mode }}

  publish:
    name: prerelease
    needs: [verify, mac]
    if: inputs.release || startsWith(github.ref, 'refs/tags/zh-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Ein-zh-mac-${{ needs.mac.outputs.version }}
          path: dist-zh
      - name: Publish a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_ADHOC: "本版本未经 Apple 公证：首次打开时请在“系统设置 → 隐私与安全性”中点“仍要打开”。"
        run: |
          tag="zh-v${{ needs.mac.outputs.version }}"
          notes="一念 Ein Mac 安装包：Apple 芯片选 apple-silicon，Intel 机型选 intel。"
          if [ "${{ needs.mac.outputs.signing }}" = "adhoc" ]; then notes="$notes$NOTES_ADHOC"; fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
                 --title "一念 Ein ${{ needs.mac.outputs.version }}" --notes "$notes"
          gh release upload "$tag" dist-zh/*.dmg --repo "$GITHUB_REPOSITORY" --clobber
