<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">一念 Ein</title>
  <desc id="desc">A bold ink pixel stroke 一 on a white sheet tile, with a cobalt pixel spark of thought twinkling above its right end.</desc>

  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="230.4"/></clipPath>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e6ec"/>
    </linearGradient>
  </defs>

  <!-- macOS icon grid: the tile is 824x824 inside the 1024 canvas (corner radius
       185.4), not the full canvas, so it sits at the same size as every other
       Big Sur+ icon in the Dock. The tile is drawn at 1024 and scaled into the grid. -->
  <g transform="translate(100 100) scale(0.8046875)">
    <g clip-path="url(#tile)">
      <rect width="1024" height="1024" fill="url(#sheet)"/>
    </g>
  </g>

  <!-- Pixel art in canvas coordinates: one art pixel is a 32-unit square on the
       canvas grid, so it lands on exactly 1 px at 32x32, 2 px at 64x64 and so on,
       and the stroke spans whole 64-unit cells so it stays crisp at 16x16 too. -->
  <!-- the stroke's one-cell pixel shadow -->
  <path fill="#d3d9e3" d="M256 672h576v32h-576zM224 704h640v64h-640zM256 768h576v32h-576z"/>
  <!-- the stroke 一 -->
  <path fill="#14161c" d="M224 640h576v32h-576zM192 672h640v64h-640zM224 736h576v32h-576z"/>
  <!-- glow behind the spark -->
  <path fill="#eef1ff" d="M672 288h32v32h-32zM640 320h96v32h-96zM608 352h160v32h-160zM576 384h224v32h-224zM608 416h160v32h-160zM640 448h96v32h-96zM672 480h32v32h-32z"/>
  <path fill="#dfe5ff" d="M672 320h32v32h-32zM640 352h96v32h-96zM608 384h160v32h-160zM640 416h96v32h-96zM672 448h32v32h-32z"/>
  <!-- the spark of thought: a cobalt pixel twinkle whose right tip lines up with the stroke's end -->
  <path fill="#3b5bff" d="M672 288h32v64h-32zM640 352h96v32h-96zM576 384h224v32h-224zM640 416h96v32h-96zM672 448h32v64h-32z"/>
  <path fill="#9aabff" d="M672 256h32v32h-32zM544 384h32v32h-32zM800 384h32v32h-32zM672 512h32v32h-32z"/>
</svg>
